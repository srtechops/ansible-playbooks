- hosts: all
  remote_user: ec2-user
  become: true 


  tasks:
    - name: install apache webserice 
      yum:
        name: httpd
        state: installed 

    - name: start httpd service 
      service:
        name: httpd 
        state: started
    
    - name: copy index.html file to /var/www/html
      copy:
        src: /etc/ansible/index.html
        dest: /var/www/html



